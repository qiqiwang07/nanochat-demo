<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 助手</title>
<style>
  :root {
    --bg: #ffffff;
    --side-bg: #f9fafb;
    --line: #eef0f3;
    --text: #1f2329;
    --text-2: #61666d;
    --text-3: #9aa0a6;
    --accent: #1a6fff;
    --accent-hover: #0f5fe0;
    --accent-soft: #eef4ff;
    --user-bubble: #eef4ff;
    --ai-bubble: #ffffff;
    --code-bg: #f6f7f9;
    --code-border: #e8eaed;
    --shadow: 0 1px 3px rgba(0,0,0,.04);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --side-bg: #131418;
      --line: #26282e;
      --text: #e8eaed;
      --text-2: #a0a6ad;
      --text-3: #6b7178;
      --accent: #4d8dff;
      --accent-hover: #6ba0ff;
      --accent-soft: #1d2534;
      --user-bubble: #1d2534;
      --ai-bubble: #17181c;
      --code-bg: #1f2127;
      --code-border: #2c2f36;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ==================== 左侧栏 ==================== */
  #side {
    width: 260px;
    flex-shrink: 0;
    background: var(--side-bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transition: margin-left .22s ease;
  }
  #side.hidden { margin-left: -260px; }
  .side-top { padding: 14px 12px 8px; }
  #newchat {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background .15s, border-color .15s;
    box-shadow: var(--shadow);
  }
  #newchat:hover { border-color: var(--accent); color: var(--accent); }
  #newchat svg { width: 15px; height: 15px; }
  .side-label {
    font-size: 12px;
    color: var(--text-3);
    padding: 14px 18px 6px;
    font-weight: 500;
  }
  #sessions {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  #sessions::-webkit-scrollbar { width: 6px; }
  #sessions::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 3px; }
  @media (prefers-color-scheme: dark) {
    #sessions::-webkit-scrollbar-thumb { background: #33363d; }
  }
  .empty-hint { color: var(--text-3); font-size: 13px; padding: 8px 10px; line-height: 1.6; }
  .sess {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text-2);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s;
    margin-bottom: 1px;
  }
  .sess:hover { background: rgba(0,0,0,.045); }
  @media (prefers-color-scheme: dark) { .sess:hover { background: rgba(255,255,255,.05); } }
  .sess.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .sess .ic { flex-shrink: 0; opacity: .55; font-size: 13px; }
  .sess .tt { overflow: hidden; text-overflow: ellipsis; }
  .side-bottom {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.7;
  }
  .side-bottom .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #34c759; margin-right: 5px; vertical-align: 1px;
  }

  /* ==================== 主区域 ==================== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  header {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  header.scrolled { border-bottom-color: var(--line); }
  #toggle {
    width: 32px; height: 32px;
    border: none; background: transparent;
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
  }
  #toggle:hover { background: rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) { #toggle:hover { background: rgba(255,255,255,.06); } }
  #toggle svg { width: 18px; height: 18px; }
  header .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .badge {
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border-radius: 5px;
  }
  header .spacer { flex: 1; }

  /* ==================== 消息区 ==================== */
  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 24px;
    scroll-behavior: smooth;
  }
  #msgs::-webkit-scrollbar { width: 8px; }
  #msgs::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 4px; }
  @media (prefers-color-scheme: dark) {
    #msgs::-webkit-scrollbar-thumb { background: #33363d; }
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* 欢迎页 */
  #welcome {
    max-width: 780px;
    margin: 0 auto;
    padding: 8vh 24px 0;
    text-align: center;
  }
  #welcome .logo {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1a6fff, #4d8dff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(26,111,255,.28);
  }
  #welcome h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -.3px;
  }
  #welcome p {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 32px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    text-align: left;
  }
  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all .15s;
    background: var(--bg);
  }
  .card:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  .card .t { font-size: 13.8px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
  .card .d { font-size: 12.5px; color: var(--text-3); }

  /* 消息 */
  .row {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    animation: fadein .25s ease both;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .row.user { justify-content: flex-end; }
  .av {
    width: 30px; height: 30px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    margin-top: 2px;
  }
  .row.ai .av {
    background: linear-gradient(135deg, #1a6fff, #4d8dff);
    color: #fff;
  }
  .row.user .av { display: none; }
  .body { min-width: 0; flex: 1; }
  .row.user .body { flex: 0 1 auto; max-width: 80%; }
  .bubble {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    padding: 10px 15px;
    border-radius: 14px;
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { font-weight: 600; }
  .bubble h3 {
    font-size: 15.5px; font-weight: 600;
    margin: 16px 0 8px;
  }
  .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 8px 0 10px; padding-left: 22px; }
  .bubble li { margin: 4px 0; }
  .bubble code.ic {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 13.5px;
    font-family: "SF Mono", Consolas, monospace;
    color: #d6336c;
  }
  @media (prefers-color-scheme: dark) { .bubble code.ic { color: #ff7ba9; } }
  .bubble .codebox {
    margin: 10px 0;
    border: 1px solid var(--code-border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--code-bg);
  }
  .bubble .codehead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px;
    font-size: 11.5px;
    color: var(--text-3);
    border-bottom: 1px solid var(--code-border);
    font-family: "SF Mono", Consolas, monospace;
  }
  .bubble .codehead .cp {
    cursor: pointer; border: none; background: transparent;
    color: var(--text-3); font-size: 11.5px; font-family: inherit;
  }
  .bubble .codehead .cp:hover { color: var(--accent); }
  .bubble pre {
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
    font-family: "SF Mono", Consolas, monospace;
    white-space: pre;
    margin: 0;
  }
  .meta {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .row.user .meta { justify-content: flex-end; }

  /* 加载动画 */
  .loading { display: flex; gap: 4px; padding: 6px 0; align-items: center; }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    opacity: .35;
    animation: blink 1.3s infinite;
  }
  .loading span:nth-child(2) { animation-delay: .18s; }
  .loading span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-3px) } }

  /* 输入区 */
  #composer-area {
    flex-shrink: 0;
    padding: 0 0 18px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .composer {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }
  #box {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--bg);
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
    transition: border-color .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    padding: 10px 10px 8px 16px;
  }
  #box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 2px 16px rgba(26,111,255,.12);
  }
  #inp {
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background: transparent;
    max-height: 200px;
    min-height: 24px;
    padding: 2px 0;
  }
  #inp::placeholder { color: var(--text-3); }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
  }
  #send {
    width: 32px; height: 32px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, opacity .15s;
  }
  #send:hover:not(:disabled) { background: var(--accent-hover); }
  #send:disabled { background: var(--line); cursor: default; }
  #send svg { width: 16px; height: 16px; }
  .hint { text-align: center; font-size: 11.5px; color: var(--text-3); margin-top: 8px; }

  @media (max-width: 768px) {
    #side {
      position: absolute;
      z-index: 100;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,.1);
    }
    #side.hidden { margin-left: -260px; }
    .wrap, .composer, #welcome { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<aside id="side">
  <div class="side-top">
    <button id="newchat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      新对话
    </button>
  </div>
  <div class="side-label">最近对话</div>
  <div id="sessions"></div>
  <div class="side-bottom">
    <span class="dot"></span>服务在线 · 模型在云端运行
  </div>
</aside>

<main id="main">
  <header id="hdr">
    <button id="toggle" title="展开/收起侧边栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <div class="title">AI 助手 <span class="badge">DeepSeek-R1</span></div>
    <div class="spacer"></div>
  </header>

  <div id="msgs">
    <div id="welcome">
      <div class="logo">AI</div>
      <h1>有什么可以帮你的？</h1>
      <p>支持数学解题、知识问答、代码编写</p>
    </div>
  </div>

  <div id="composer-area">
    <div class="composer">
      <div id="box">
        <textarea id="inp" rows="1" placeholder="给 AI 助手发送消息"></textarea>
        <div class="toolbar">
          <button id="send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="hint">内容由 AI 生成，请仔细甄别</div>
    </div>
  </div>
</main>

<script>
const msgsEl = document.getElementById('msgs');
const welcomeEl = document.getElementById('welcome');
const sessionsEl = document.getElementById('sessions');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');
const side = document.getElementById('side');
const hdr = document.getElementById('hdr');
let current = null;
let busy = false;

/* ---------------- 渲染 ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMD(text) {
  let s = escapeHtml(text);
  // 代码块
  const blocks = [];
  s = s.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const i = blocks.length;
    blocks.push({ lang: lang || 'text', code: code.replace(/\n$/, '') });
    return `\u0000B${i}\u0000`;
  });
  // 行内代码
  s = s.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  // 粗体
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // 标题
  s = s.replace(/^#{1,4}\s+(.+)$/gm, '<h3>$1</h3>');
  // 列表
  s = s.replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  // 段落
  s = s.split(/\n{2,}/).map(p => {
    if (/^\s*<(ul|h3|div)/.test(p) || p.includes('\u0000B')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  // 还原代码块
  s = s.replace(/\u0000B(\d+)\u0000/g, (m, i) => {
    const b = blocks[i];
    return `<div class="codebox"><div class="codehead"><span>${escapeHtml(b.lang)}</span>` +
           `<button class="cp" onclick="copyCode(this)">复制</button></div>` +
           `<pre>${escapeHtml(b.code)}</pre></div>`;
  });
  return s;
}

window.copyCode = function (btn) {
  const code = btn.closest('.codebox').querySelector('pre').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
};

function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function hideWelcome() {
  if (welcomeEl && welcomeEl.parentNode) {
    welcomeEl.remove();
  }
}

function addRow(role) {
  hideWelcome();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = 'AI';
    row.appendChild(av);
  }
  const body = document.createElement('div');
  body.className = 'body';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  body.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = nowTime();
  body.appendChild(meta);
  row.appendChild(body);
  msgsEl.appendChild(row);
  scrollBottom();
  return { row, bubble, meta };
}

function scrollBottom() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addUser(text) {
  const { bubble } = addRow('user');
  bubble.textContent = text;
}

function addError(text) {
  const { bubble } = addRow('ai');
  bubble.textContent = text;
  bubble.style.color = '#e5484d';
}

/* ---------------- 会话 ---------------- */
async function newChat() {
  try {
    const r = await fetch('/new', { method: 'POST' });
    const d = await r.json();
    current = d.id;
  } catch (e) { current = null; }
  msgsEl.innerHTML = '';
  location.reload();
}

async function loadSessions() {
  try {
    const r = await fetch('/sessions');
    const d = await r.json();
    sessionsEl.innerHTML = '';
    if (!d.sessions || !d.sessions.length) {
      sessionsEl.innerHTML = '<div class="empty-hint">还没有对话记录</div>';
      return;
    }
    for (const s of d.sessions) {
      const el = document.createElement('div');
      el.className = 'sess' + (s.id === current ? ' active' : '');
      el.dataset.id = s.id;
      el.innerHTML = '<span class="ic">💬</span><span class="tt"></span>';
      el.querySelector('.tt').textContent = s.title || '新对话';
      el.title = s.title || '';
      el.onclick = () => openSession(s.id);
      sessionsEl.appendChild(el);
    }
  } catch (e) { }
}

async function openSession(id) {
  current = id;
  try {
    const r = await fetch('/session?id=' + encodeURIComponent(id));
    const d = await r.json();
    msgsEl.innerHTML = '';
    for (const line of (d.log || '').split('\n')) {
      if (line.startsWith('### User: ')) addUser(line.slice(10));
      else if (line.startsWith('### Assistant: ')) {
        const { bubble } = addRow('ai');
        bubble.innerHTML = renderMD(line.slice(15));
      }
    }
    await loadSessions();
  } catch (e) { }
}

/* ---------------- 发送 ---------------- */
async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true;
  sendBtn.disabled = true;
  addUser(text);
  inp.value = '';
  autosize();

  const { bubble, meta } = addRow('ai');
  bubble.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
  let acc = '', usage = null, sid = current, started = false;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, session: current || '' })
    });
    if (!resp.ok || !resp.body) throw new Error('bad response');
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const p = line.slice(5).trim();
        if (p === '[DONE]') continue;
        let obj;
        try { obj = JSON.parse(p); } catch (e) { continue; }
        if (obj.delta) {
          if (!started) { started = true; bubble.textContent = ''; }
          acc += obj.delta;
          bubble.textContent = acc;
          scrollBottom();
        }
        if (obj.usage) usage = obj.usage;
        if (obj.session) sid = obj.session;
      }
    }
  } catch (e) {
    if (!acc) break;
  }

  if (!acc) {
    bubble.textContent = '连接失败，请稍后重试';
  } else {
    bubble.innerHTML = renderMD(acc);
  }
  if (usage && (usage.total > 0)) {
    const span = document.createElement('span');
    span.textContent = `↑${usage.in} ↓${usage.out} · ${usage.total} tokens`;
    meta.appendChild(span);
  }
  if (sid) current = sid;
  busy = false;
  sendBtn.disabled = inp.value.trim() === '';
  scrollBottom();
  await loadSessions();
}

/* ---------------- 输入框 ---------------- */
function autosize() {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 200) + 'px';
  sendBtn.disabled = busy || inp.value.trim() === '';
}
inp.addEventListener('input', autosize);
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    ask(inp.value);
  }
});
sendBtn.addEventListener('click', () => ask(inp.value));

document.getElementById('newchat').addEventListener('click', newChat);
document.getElementById('toggle').addEventListener('click', () => {
  side.classList.toggle('hidden');
});

document.querySelectorAll('.card').forEach(c => {
  c.addEventListener('click', () => ask(c.dataset.q));
});
msgsEl.addEventListener('scroll', () => {
  hdr.classList.toggle('scrolled', msgsEl.scrollTop > 4);
});

/* 启动 */
loadSessions();
autosize();
inp.focus();
</script>
</body>
</html>
