<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 助手</title>
<style>
  :root {
    --bg: #ffffff;
    --side-bg: #f9fafb;
    --line: #eef0f3;
    --text: #1f2329;
    --text-2: #61666d;
    --text-3: #9aa0a6;
    --accent: #1a6fff;
    --accent-hover: #0f5fe0;
    --accent-soft: #eef4ff;
    --user-bubble: #eef4ff;
    --ai-bubble: #ffffff;
    --code-bg: #f6f7f9;
    --code-border: #e8eaed;
    --shadow: 0 1px 3px rgba(0,0,0,.04);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --side-bg: #131418;
      --line: #26282e;
      --text: #e8eaed;
      --text-2: #a0a6ad;
      --text-3: #6b7178;
      --accent: #4d8dff;
      --accent-hover: #6ba0ff;
      --accent-soft: #1d2534;
      --user-bubble: #1d2534;
      --ai-bubble: #17181c;
      --code-bg: #1f2127;
      --code-border: #2c2f36;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ==================== 左侧栏 ==================== */
  #side {
    width: 260px;
    flex-shrink: 0;
    background: var(--side-bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transition: margin-left .22s ease;
  }
  #side.hidden { margin-left: -260px; }
  .side-top { padding: 14px 12px 8px; }
  #newchat {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background .15s, border-color .15s;
    box-shadow: var(--shadow);
  }
  #newchat:hover { border-color: var(--accent); color: var(--accent); }
  #newchat svg { width: 15px; height: 15px; }
  .side-label {
    font-size: 12px;
    color: var(--text-3);
    padding: 14px 18px 6px;
    font-weight: 500;
  }
  #sessions {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  #sessions::-webkit-scrollbar { width: 6px; }
  #sessions::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 3px; }
  @media (prefers-color-scheme: dark) {
    #sessions::-webkit-scrollbar-thumb { background: #33363d; }
  }
  .empty-hint { color: var(--text-3); font-size: 13px; padding: 8px 10px; line-height: 1.6; }
  .sess {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text-2);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s;
    margin-bottom: 1px;
  }
  .sess:hover { background: rgba(0,0,0,.045); }
  @media (prefers-color-scheme: dark) { .sess:hover { background: rgba(255,255,255,.05); } }
  .sess.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .sess .ic { flex-shrink: 0; opacity: .55; font-size: 13px; }
  .sess .tt { overflow: hidden; text-overflow: ellipsis; }
  .side-bottom {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.7;
  }
  .side-bottom .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #34c759; margin-right: 5px; vertical-align: 1px;
  }

  /* ==================== 主区域 ==================== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  header {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  header.scrolled { border-bottom-color: var(--line); }
  #toggle {
    width: 32px; height: 32px;
    border: none; background: transparent;
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
  }
  #toggle:hover { background: rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) { #toggle:hover { background: rgba(255,255,255,.06); } }
  #toggle svg { width: 18px; height: 18px; }
  header .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .badge {
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border-radius: 5px;
  }
  header .spacer { flex: 1; }

  /* ==================== 消息区 ==================== */
  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 24px;
    scroll-behavior: smooth;
  }
  #msgs::-webkit-scrollbar { width: 8px; }
  #msgs::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 4px; }
  @media (prefers-color-scheme: dark) {
    #msgs::-webkit-scrollbar-thumb { background: #33363d; }
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* 欢迎页 */
  #welcome {
    max-width: 780px;
    margin: 0 auto;
    padding: 8vh 24px 0;
    text-align: center;
  }
  #welcome .logo {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1a6fff, #4d8dff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(26,111,255,.28);
  }
  #welcome h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -.3px;
  }
  #welcome p {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 32px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    text-align: left;
  }
  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all .15s;
    background: var(--bg);
  }
  .card:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  .card .t { font-size: 13.8px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
  .card .d { font-size: 12.5px; color: var(--text-3); }

  /* 消息 */
  .row {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    animation: fadein .25s ease both;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .row.user { justify-content: flex-end; }
  .av {
    width: 30px; height: 30px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    margin-top: 2px;
  }
  .row.ai .av {
    background: linear-gradient(135deg, #1a6fff, #4d8dff);
    color: #fff;
  }
  .row.user .av { display: none; }
  .body { min-width: 0; flex: 1; }
  .row.user .body { flex: 0 1 auto; max-width: 80%; }
  .bubble {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    padding: 10px 15px;
    border-radius: 14px;
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { font-weight: 600; }
  .bubble h3 {
    font-size: 15.5px; font-weight: 600;
    margin: 16px 0 8px;
  }
  .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 8px 0 10px; padding-left: 22px; }
  .bubble li { margin: 4px 0; }
  .bubble code.ic {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: 13.5px;
    font-family: "SF Mono", Consolas, monospace;
    color: #d6336c;
  }
  @media (prefers-color-scheme: dark) { .bubble code.ic { color: #ff7ba9; } }
  .bubble .codebox {
    margin: 10px 0;
    border: 1px solid var(--code-border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--code-bg);
  }
  .bubble .codehead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px;
    font-size: 11.5px;
    color: var(--text-3);
    border-bottom: 1px solid var(--code-border);
    font-family: "SF Mono", Consolas, monospace;
  }
  .bubble .codehead .cp {
    cursor: pointer; border: none; background: transparent;
    color: var(--text-3); font-size: 11.5px; font-family: inherit;
  }
  .bubble .codehead .cp:hover { color: var(--accent); }
  .bubble pre {
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
    font-family: "SF Mono", Consolas, monospace;
    white-space: pre;
    margin: 0;
  }
  .meta {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .row.user .meta { justify-content: flex-end; }

  /* 加载动画 */
  .loading { display: flex; gap: 4px; padding: 6px 0; align-items: center; }
  /* 等待提示：告诉用户已经过了多久，否则 7B 模型几十秒不出字会让人以为没发出去 */
  .waiting { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13.5px; }
  .waiting .sec { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 500; }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    opacity: .35;
    animation: blink 1.3s infinite;
  }
  .loading span:nth-child(2) { animation-delay: .18s; }
  .loading span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-3px) } }

  /* 输入区 */
  #composer-area {
    flex-shrink: 0;
    padding: 0 0 18px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .composer {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }
  #box {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--bg);
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
    transition: border-color .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    padding: 10px 10px 8px 16px;
  }
  #box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 2px 16px rgba(26,111,255,.12);
  }
  #inp {
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background: transparent;
    max-height: 200px;
    min-height: 24px;
    padding: 2px 0;
  }
  #inp::placeholder { color: var(--text-3); }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
  }
  #send {
    width: 32px; height: 32px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, opacity .15s;
  }
  #send:hover:not(:disabled) { background: var(--accent-hover); }
  #send:disabled { background: var(--line); cursor: default; }
  #send svg { width: 16px; height: 16px; }
  .hint { text-align: center; font-size: 11.5px; color: var(--text-3); margin-top: 8px; }

  @media (max-width: 768px) {
    #side {
      position: absolute;
      z-index: 100;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,.1);
    }
    #side.hidden { margin-left: -260px; }
    .wrap, .composer, #welcome { padding-left: 16px; padding-right: 16px; }
  }

  /* ---- Markdown 渲染样式：让标题、列表、引用、表格、公式都好看 ---- */
  .bubble h3 { font-size: 16.5px; font-weight: 600; margin: 18px 0 8px; color: var(--text); }
  .bubble h4, .bubble h5 { font-size: 15.5px; font-weight: 600; margin: 14px 0 6px; }
  .bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 8px 0 10px; padding-left: 24px; }
  .bubble li { margin: 5px 0; line-height: 1.7; }
  .bubble ul li { list-style: disc; }
  .bubble ol li { list-style: decimal; }
  .bubble blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    margin: 10px 0; padding: 8px 14px; border-radius: 0 8px 8px 0;
    color: var(--text-2);
  }
  .bubble hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .bubble em { font-style: italic; }
  .bubble del { text-decoration: line-through; opacity: .65; }
  .bubble .tablewrap { overflow-x: auto; margin: 10px 0; }
  .bubble table { border-collapse: collapse; font-size: 14px; min-width: 50%; }
  .bubble th, .bubble td { border: 1px solid var(--code-border); padding: 6px 12px; text-align: left; }
  .bubble th { background: var(--code-bg); font-weight: 600; }
  /* 公式：没有引入 KaTeX，用等宽字体 + 底色呈现，可读且不依赖网络 */
  .bubble code.mathin {
    background: var(--code-bg); border: 1px solid var(--code-border);
    padding: 1px 6px; border-radius: 5px; font-size: 13.5px;
    font-family: "Cambria Math", "Latin Modern Math", Consolas, monospace; color: var(--text);
  }
  .bubble strong.answer {
    display: inline-block; background: #fff4d6; color: #8a5a00;
    border: 1px solid #f0d089; padding: 2px 10px; border-radius: 6px;
    font-weight: 700; font-size: 15px;
  }
  @media (prefers-color-scheme: dark) {
    .bubble strong.answer { background: #3a2f12; color: #ffd479; border-color: #6b5420; }
  }
  .bubble code.mathblock {
    display: block; background: var(--code-bg); border: 1px solid var(--code-border);
    padding: 10px 14px; border-radius: 8px; margin: 10px 0;
    font-size: 13.5px; white-space: pre-wrap;
    font-family: "Cambria Math", "Latin Modern Math", Consolas, monospace; color: var(--text);
  }
</style>
</head>
<body>

<aside id="side">
  <div class="side-top">
    <button id="newchat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      新对话
    </button>
  </div>
  <div class="side-label">最近对话</div>
  <div id="sessions"></div>
  <div class="side-bottom">
    <span class="dot"></span>服务在线 · 模型在云端运行
  </div>
</aside>

<main id="main">
  <header id="hdr">
    <button id="toggle" title="展开/收起侧边栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <div class="title">AI 助手 <span class="badge">DeepSeek-R1</span></div>
    <div class="spacer"></div>
  </header>

  <div id="msgs">
    <div id="welcome">
      <div class="logo">AI</div>
      <h1>有什么可以帮你的？</h1>
      <p>支持数学解题、知识问答、代码编写</p>
    </div>
  </div>

  <div id="composer-area">
    <div class="composer">
      <div id="box">
        <textarea id="inp" rows="1" placeholder="给 AI 助手发送消息"></textarea>
        <div class="toolbar">
          <button id="send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="hint">内容由 AI 生成，请仔细甄别</div>
    </div>
  </div>
</main>

<script>
/* ============================================================
 * 前端主逻辑
 * 服务端接口：
 *   GET  /            返回本页面
 *   GET  /sessions    会话列表 [{id, title}]
 *   GET  /session?id= 某个会话的完整记录 {log: "### User: ...\n### Assistant: ..."}
 *   POST /new         新建会话，返回 {id}
 *   POST /chat        SSE 流式对话 {text, session} → 多个 {delta} 帧 + 一帧 {session, usage}
 * ============================================================ */

const msgsEl = document.getElementById('msgs');            // 消息容器，所有气泡都插到这里
const welcomeEl = document.getElementById('welcome');      // 欢迎页（发第一条消息后移除）
const sessionsEl = document.getElementById('sessions');    // 左侧会话列表容器
const inp = document.getElementById('inp');                // 输入框
const sendBtn = document.getElementById('send');           // 发送按钮
const side = document.getElementById('side');              // 左侧栏（可折叠）
const hdr = document.getElementById('hdr');                // 顶栏（滚动时加分隔线）
let current = null;                                        // 当前会话 ID，null 表示还没建
let busy = false;                                          // 是否正在等回答，防止重复发送

/* ---------------- 渲染 ---------------- */

function escapeHtml(s) {
  // 先转义三个危险字符，避免模型输出里的 <script> 被当成标签执行
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMD(text) {
  // 把模型输出的 Markdown 渲染成 HTML。
  // 为什么不用第三方库：整个页面要能在内网/离线环境跑，不引外部 CDN。
  let s = escapeHtml(text);                                // 先整体转义，后面再插入受控标签

  const blocks = [];                                       // 暂存代码块，避免被后续规则破坏
  const maths = [];                                        // 暂存公式，最后按行内/块级还原

  // 1) 代码块 ```lang\n...\n```
  s = s.replace(/```([a-zA-Z0-9+#]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const i = blocks.length;                               // 记录序号
    blocks.push({ lang: lang || 'text', code: code.replace(/\n$/, '') });  // 去掉末尾换行
    return `\u0000B${i}\u0000`;                            // 占位符
  });

  // 2) 公式：先抽出来，避免里面的 * _ \ 被当成 Markdown
  //    块级 $$...$$ 或 \[...\]
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, e) => {
    const i = maths.length; maths.push({ block: true, tex: e.trim() });
    return `\u0000M${i}\u0000`;
  });
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, e) => {
    const i = maths.length; maths.push({ block: true, tex: e.trim() });
    return `\u0000M${i}\u0000`;
  });
  //    行内 \(...\) 或 $...$
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, e) => {
    const i = maths.length; maths.push({ block: false, tex: e.trim() });
    return `\u0000M${i}\u0000`;
  });
  s = s.replace(/\$([^$\n]+?)\$/g, (m, e) => {
    const i = maths.length; maths.push({ block: false, tex: e.trim() });
    return `\u0000M${i}\u0000`;
  });

  // 3) 标题：# ~ ######
  s = s.replace(/^######\s+(.+)$/gm, '<h5>$1</h5>');
  s = s.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  s = s.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  s = s.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^##\s+(.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^#\s+(.+)$/gm, '<h3>$1</h3>');

  // 4) 分隔线
  s = s.replace(/^\s*(---|\*\*\*|___)\s*$/gm, '<hr>');

  // 5) 引用块
  s = s.replace(/^&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/<\/blockquote>\n<blockquote>/g, '<br>');

  // 6) 行内代码（在粗斜体之前，避免里面的符号被处理）
  const inlines = [];
  s = s.replace(/`([^`\n]+)`/g, (m, code) => {
    const i = inlines.length; inlines.push(code);
    return `\u0000C${i}\u0000`;
  });

  // 7) 粗体、斜体、删除线
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

  // 8) 表格：连续的 | a | b | 行
  s = s.replace(/((?:^\s*\|.*\|\s*$\n?){2,})/gm, (m) => {
    const rows = m.trim().split('\n').filter(r => r.trim());  // 逐行
    if (rows.length < 2) return m;                             // 至少两行才算表格
    let html = '<div class="tablewrap"><table>';
    rows.forEach((row, idx) => {
      const cells = row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) return;      // 跳过分隔行 |---|---|
      const tag = idx === 0 ? 'th' : 'td';                     // 第一行当表头
      html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
    });
    return html + '</table></div>';
  });

  // 9) 列表：逐行解析，边扫边开关 ul/ol，避免两种列表互相嵌套
  {
    const src = s.split('\n');                              // 按行拆开
    const dst = [];                                          // 输出行
    let typ = null;                                          // 当前所在列表类型
    const close = () => { if (typ) { dst.push('</' + typ + '>'); typ = null; } };  // 结束当前列表
    for (const ln of src) {
      const mu = ln.match(/^[ \t]*[-*+]\s+(.+)$/);          // 无序项
      const mo = ln.match(/^[ \t]*\d+[.)]\s+(.+)$/);       // 有序项
      if (mu || mo) {
        const want = mu ? 'ul' : 'ol';                       // 目标类型
        if (typ !== want) { close(); dst.push('<' + want + '>'); typ = want; }  // 类型变了就换标签
        dst.push('<li>' + (mu ? mu[1] : mo[1]) + '</li>');   // 追加列表项
      } else {
        close();                                             // 非列表行，先关掉列表
        dst.push(ln);                                        // 原样输出
      }
    }
    close();                                                 // 收尾关闭
    s = dst.join('\n');
  }

  // 9.5) 正文里没被公式包裹的 \boxed{答案} 也高亮出来（数学题常用）
  s = s.replace(/\\boxed\s*\{([^{}]*)\}/g, '<strong class="answer">$1</strong>');

  // 10) 段落：按空行切分
  s = s.split(/\n{2,}/).map(p => {
    const trimmed = p.trim();
    if (!trimmed) return '';
    if (/^<(h\d|ul|ol|li|div|blockquote|hr|table)/.test(trimmed)) return trimmed;  // 已是块级元素
    if (trimmed.includes('\u0000B') && trimmed.length < 40) return trimmed;        // 纯代码块占位
    return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';  // 普通段落，段内换行用 br
  }).join('');

  // 11) 还原行内代码
  s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => `<code class="ic">${escapeHtml(inlines[i])}</code>`);

  // 12) 还原公式：去掉 LaTeX 定界符和常见命令，按代码样式显示
  s = s.replace(/\u0000M(\d+)\u0000/g, (m, i) => {
    const it = maths[i];
    let tex = it.tex;
    tex = tex.replace(/^\s*\\displaystyle\s*/, '');                       // 去样式命令
    tex = tex.replace(/\\boxed\s*\{([^{}]*)\}/g, '$1');                   // \boxed{x} → x
    tex = tex.replace(/\\text\s*\{([^{}]*)\}/g, '$1');                    // \text{中文} → 中文
    tex = tex.replace(/\\mathrm\s*\{([^{}]*)\}/g, '$1');
    tex = tex.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');  // 分数改成 a/b
    tex = tex.replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)');
    tex = tex.replace(/\\(cdot|times)/g, '×');
    tex = tex.replace(/\\div/g, '÷');
    tex = tex.replace(/\\(le|leq)/g, '≤');
    tex = tex.replace(/\\(ge|geq)/g, '≥');
    tex = tex.replace(/\\neq/g, '≠');
    tex = tex.replace(/\\pm/g, '±');
    tex = tex.replace(/\\infty/g, '∞');
    tex = tex.replace(/\\sum/g, 'Σ');
    tex = tex.replace(/\\int/g, '∫');
    tex = tex.replace(/\\(alpha|beta|gamma|delta|theta|lambda|mu|pi|sigma|omega)/g, (mm, g) => {
      const greek = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', theta: 'θ',
                      lambda: 'λ', mu: 'μ', pi: 'π', sigma: 'σ', omega: 'ω' };
      return greek[g] || g;
    });
    tex = tex.replace(/\\[a-zA-Z]+\s*/g, '');                             // 其余未知命令直接丢掉
    // 上标/下标的花括号转成括号，保住分组：Q^{-1} → Q^(-1)
    tex = tex.replace(/\^\s*\{([^{}]*)\}/g, '^($1)');
    tex = tex.replace(/_\s*\{([^{}]*)\}/g, '_($1)');
    tex = tex.replace(/[{}]/g, ' ');                                      // 剩余花括号改成空格
    tex = tex.replace(/\s+/g, ' ').trim();                                // 压缩空白
    const cls = it.block ? 'mathblock' : 'mathin';
    return `<code class="${cls}">${escapeHtml(tex)}</code>`;
  });

  // 13) 还原代码块
  s = s.replace(/\u0000B(\d+)\u0000/g, (m, i) => {
    const b = blocks[i];
    return `<div class="codebox"><div class="codehead"><span>${escapeHtml(b.lang)}</span>` +
           `<button class="cp" onclick="copyCode(this)">复制</button></div>` +
           `<pre>${escapeHtml(b.code)}</pre></div>`;          // 代码二次转义，防注入
  });

  return s;                                                  // 返回渲染好的 HTML
}

window.copyCode = function (btn) {
  // 复制代码块内容到剪贴板；用 closest 找到所属代码块，避免多个按钮混淆
  const code = btn.closest('.codebox').querySelector('pre').textContent;  // 取纯文本，不带标签
  navigator.clipboard.writeText(code).then(() => {         // 现代浏览器都支持异步剪贴板 API
    btn.textContent = '已复制';                             // 给用户即时反馈
    setTimeout(() => btn.textContent = '复制', 1500);      // 1.5 秒后恢复，避免长期占位
  });
};

function nowTime() {
  // 生成 HH:MM 形式的时间戳，用于消息下方的小字
  const d = new Date();                                    // 当前时间
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');  // 补零成两位数
}

function hideWelcome() {
  // 首条消息发出后去掉欢迎页，避免和气泡挤在一起
  if (welcomeEl && welcomeEl.parentNode) {                 // 存在且还挂在文档上
    welcomeEl.remove();                                    // 从 DOM 移除
  }
}

function addRow(role) {
  // 创建一个消息行，返回可操作的句柄 {row, bubble, meta}
  hideWelcome();                                           // 一旦有消息，欢迎页就该消失
  const row = document.createElement('div');               // 行容器
  row.className = 'row ' + role;                           // role 为 user 或 ai，决定左右布局
  if (role === 'ai') {                                     // AI 消息左侧带头像
    const av = document.createElement('div');              // 头像容器
    av.className = 'av';                                   // 样式类
    av.textContent = 'AI';                                 // 简单文字头像，省一张图
    row.appendChild(av);                                   // 插到行首
  }
  const body = document.createElement('div');              // 气泡 + 时间的容器
  body.className = 'body';
  const bubble = document.createElement('div');            // 气泡本体
  bubble.className = 'bubble';
  body.appendChild(bubble);                                // 先挂气泡
  const meta = document.createElement('div');              // 元信息行（时间、token）
  meta.className = 'meta';
  meta.textContent = nowTime();                            // 默认显示时间
  body.appendChild(meta);                                  // 再挂元信息
  row.appendChild(body);                                   // 组装
  msgsEl.appendChild(row);                                 // 插入页面
  scrollBottom();                                          // 新消息总是滚到底部
  return { row, bubble, meta };                            // 返回句柄供调用方填充
}

function scrollBottom() {
  // 滚到最底部：把滚动位置设为内容高度
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addUser(text) {
  // 添加一条用户消息（纯文本，不做 Markdown 渲染）
  const { bubble } = addRow('user');                       // 只要气泡，不需要元信息
  bubble.textContent = text;                               // textContent 天然防注入
}

function addError(text) {
  // 以红色文字显示错误，与正常回答区分
  const { bubble } = addRow('ai');                         // 借用 AI 行的样式
  bubble.textContent = text;                               // 错误文本
  bubble.style.color = '#e5484d';                          // 红色，提醒用户注意
}

/* ---------------- 会话 ---------------- */

async function newChat() {
  // 新建会话：先让服务端建一个空会话，再刷新页面回到初始状态
  try {
    const r = await fetch('/new', { method: 'POST' });     // 只发空请求体，服务端自己生成 ID
    const d = await r.json();                              // 返回 {id}
    current = d.id;                                        // 记住新会话 ID
  } catch (e) { current = null; }                          // 失败就当作没有会话，发送时再建
  msgsEl.innerHTML = '';                                   // 清空消息区
  location.reload();                                       // 刷新以重建欢迎页与状态
}

async function loadSessions() {
  // 拉取会话列表并渲染到左侧栏
  try {
    const r = await fetch('/sessions');                    // GET 列表
    const d = await r.json();                              // {sessions: [{id, title}]}
    sessionsEl.innerHTML = '';                             // 先清空，避免重复追加
    if (!d.sessions || !d.sessions.length) {               // 没有历史会话
      sessionsEl.innerHTML = '<div class="empty-hint">还没有对话记录</div>';  // 显示空状态提示
      return;                                              // 结束
    }
    for (const s of d.sessions) {                          // 逐个渲染
      const el = document.createElement('div');            // 单条会话元素
      el.className = 'sess' + (s.id === current ? ' active' : '');  // 当前会话高亮
      el.dataset.id = s.id;                                // 把 ID 存到 dataset，便于调试
      el.innerHTML = '<span class="ic">💬</span><span class="tt"></span>';  // 图标 + 标题占位
      el.querySelector('.tt').textContent = s.title || '新对话';  // 标题用 textContent 防注入
      el.title = s.title || '';                            // 悬停显示完整标题（长标题被省略号截断时有用）
      el.onclick = () => openSession(s.id);                // 点击切换到该会话
      sessionsEl.appendChild(el);                          // 插入列表
    }
  } catch (e) { }                                          // 列表加载失败不打扰用户，静默处理
}

async function openSession(id) {
  // 打开某个历史会话，把记录渲染成气泡
  current = id;                                            // 切换当前会话
  try {
    const r = await fetch('/session?id=' + encodeURIComponent(id));  // 编码防止特殊字符破坏 URL
    const d = await r.json();                              // {log: "### User: ...\n### Assistant: ..."}
    msgsEl.innerHTML = '';                                 // 清空旧内容
    for (const line of (d.log || '').split('\n')) {        // 逐行解析服务端拼好的文本
      if (line.startsWith('### User: ')) addUser(line.slice(10));  // 用户消息，去掉前缀
      else if (line.startsWith('### Assistant: ')) {       // 助手消息
        const { bubble } = addRow('ai');                   // 创建 AI 气泡
        bubble.innerHTML = renderMD(line.slice(15));       // 助手内容按 Markdown 渲染
      }
    }
    await loadSessions();                                  // 刷新左侧高亮状态
  } catch (e) { }                                          // 失败静默
}

/* ---------------- 发送 ---------------- */

async function ask(text) {
  // 发送消息并流式接收回答，这是整个页面的核心交互
  if (busy || !text.trim()) return;                        // 正在等回答或内容为空就直接忽略
  busy = true;                                             // 标记忙，防止连点
  sendBtn.disabled = true;                                 // 按钮置灰
  addUser(text);                                           // 先把用户消息显示出来
  inp.value = '';                                          // 清空输入框
  autosize();                                              // 恢复输入框高度
  const { bubble, meta } = addRow('ai');                   // 预留 AI 气泡，后面往里填
  // 显示"三个点 + 已等待 N 秒"，让用户知道请求确实发出去了
  bubble.innerHTML = '<div class="waiting">' +
    '<span class="loading"><span></span><span></span><span></span></span>' +
    '<span class="tip">正在检索知识库…</span>' +
    '<span class="sec">0s</span></div>';
  const waitStart = Date.now();                            // 记录起始时间
  const secEl = bubble.querySelector('.sec');              // 秒数显示
  const tipEl = bubble.querySelector('.tip');              // 阶段文字
  const timer = setInterval(() => {                        // 每秒刷新一次
    const s = Math.floor((Date.now() - waitStart) / 1000); // 已等待秒数
    if (secEl) secEl.textContent = s + 's';                // 更新秒数
    if (tipEl) {                                           // 分阶段提示，让等待有进度感
      if (s < 8) tipEl.textContent = '正在检索知识库…';
      else if (s < 35) tipEl.textContent = '模型正在读题…';
      else tipEl.textContent = '模型正在思考，7B 模型在 CPU 上较慢，请稍候…';
    }
  }, 1000);
  let acc = '', usage = null, sid = current, started = false;  // 累积文本、用量、会话ID、是否已开始
  let lastRender = 0;                                      // 上次渲染时间，用于节流
  try {
    const resp = await fetch('/chat', {                    // POST 发起对话
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },     // 告诉服务端是 JSON
      body: JSON.stringify({ text, session: current || '' })  // 带上会话 ID，空串表示新建
    });
    if (!resp.ok || !resp.body) throw new Error('bad response');  // 服务端异常或没有流
    const reader = resp.body.getReader();                  // 拿到可读流读取器
    const dec = new TextDecoder();                         // 字节 → 字符串解码器
    let buf = '';                                          // 行缓冲，解决一个数据块含多行/半行
    for (;;) {
      const { done, value } = await reader.read();         // 读一块数据
      if (done) break;                                     // 流结束
      buf += dec.decode(value, { stream: true });          // stream:true 处理被切断的多字节字符
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {             // 按行处理
        const line = buf.slice(0, idx).trim();             // 取出一行
        buf = buf.slice(idx + 1);                          // 从缓冲中移除该行
        if (!line.startsWith('data:')) continue;           // 忽略非数据行（SSE 心跳等）
        const p = line.slice(5).trim();                    // 去掉 "data:" 前缀
        if (p === '[DONE]') continue;                      // 结束标记后没有内容
        let obj;
        try { obj = JSON.parse(p); } catch (e) { continue; }  // 解析失败就跳过这一帧
        if (obj.delta) {                                   // 文本增量帧
          if (!started) {
            started = true;
            clearInterval(timer);                          // 停止计时
            bubble.textContent = '';                       // 清掉等待提示
            lastRender = 0;                                // 重置渲染时间戳
          }
          acc += obj.delta;                                // 累积完整回答
          const now = Date.now();                          // 当前时间
          // 每 500ms 渲染一次，兼顾"看得见格式"和"不卡顿"；段落未写完时渲染也不会崩
          if (acc.length > 120 && now - lastRender > 500) {
            bubble.innerHTML = renderMD(acc);              // 边生成边渲染
            lastRender = now;                              // 记录渲染时刻
          } else {
            bubble.textContent = acc;                      // 还没到渲染间隔就先显示纯文本
          }
          scrollBottom();                                  // 跟着滚动
        }
        if (obj.usage) usage = obj.usage;                  // 最后一帧带用量
        if (obj.session) sid = obj.session;                // 最后一帧带会话 ID
      }
    }
  } catch (e) {
    if (!acc) bubble.textContent = '连接失败，请稍后重试';   // 一个字都没收到才提示失败
  }
  clearInterval(timer);                                    // 无论成功失败都停止计时，避免定时器泄漏
  if (!acc) {                                              // 流结束但没有任何内容
    if (!started && !bubble.textContent.includes('连接失败')) {  // 一直没收到内容，也没报错
      bubble.textContent = '（没有收到回复，可能是后端超时）';   // 明确告知
    }
  } else {
    bubble.innerHTML = renderMD(acc);                      // 结束后再做一次完整 Markdown 渲染
  }
  if (usage && (usage.total > 0)) {                        // 有用量数据才显示
    const span = document.createElement('span');           // 追加到元信息行
    span.textContent = `↑${usage.in} ↓${usage.out} · ${usage.total} tokens`;  // 输入/输出/合计
    meta.appendChild(span);
  }
  if (sid) current = sid;                                  // 服务端可能新建了会话，同步 ID
  busy = false;                                            // 解除忙状态
  sendBtn.disabled = inp.value.trim() === '';              // 输入框为空则按钮保持置灰
  scrollBottom();                                          // 收尾滚到底
  await loadSessions();                                    // 刷新会话列表（标题可能刚生成）
}

/* ---------------- 输入框 ---------------- */

function autosize() {
  // 输入框高度随内容自动增长，最高 200px
  inp.style.height = 'auto';                               // 先重置，否则 scrollHeight 只增不减
  inp.style.height = Math.min(inp.scrollHeight, 200) + 'px';  // 按内容高度设置，封顶 200
  sendBtn.disabled = busy || inp.value.trim() === '';      // 有内容且不忙才允许发送
}

inp.addEventListener('input', autosize);                   // 输入时调整高度与按钮状态

inp.addEventListener('keydown', e => {
  // Enter 发送，Shift+Enter 换行
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {  // isComposing 防止中文输入法选词时误发
    e.preventDefault();                                    // 阻止默认换行
    ask(inp.value);                                        // 发送
  }
});

sendBtn.addEventListener('click', () => ask(inp.value));   // 点击发送

document.getElementById('newchat').addEventListener('click', newChat);  // 新对话按钮

document.getElementById('toggle').addEventListener('click', () => {
  side.classList.toggle('hidden');                         // 折叠/展开左侧栏
});

msgsEl.addEventListener('scroll', () => {
  // 滚动超过 4px 就给顶栏加分隔线，形成"吸顶"视觉
  hdr.classList.toggle('scrolled', msgsEl.scrollTop > 4);
});

/* 启动 */
loadSessions();                                            // 加载历史会话列表
autosize();                                               // 初始化输入框高度
inp.focus();                                              // 光标直接落在输入框，减少一次点击
</script>
