<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手</title>
<style>
  :root {
    --bg: #eef1f7; --panel: #fff; --panel-2: #f7f8fb; --line: #e6e9f0;
    --text: #1d2129; --text-2: #6b7280; --text-3: #a0a6b1;
    --accent: #4f6ef7; --accent-2: #6a8bff; --accent-soft: #eef2ff;
    --ai-bubble: #fff; --code-bg: #1e2230; --code-text: #dfe6f5;
    --shadow: 0 10px 30px rgba(31,45,84,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --panel: #1c1f27; --panel-2: #22252f; --line: #2c3040;
      --text: #e7eaf2; --text-2: #9aa1b2; --text-3: #6b7285;
      --accent: #6a8bff; --accent-2: #8aa4ff; --accent-soft: #232a44;
      --ai-bubble: #232733; --code-bg: #10131a; --code-text: #d5deef;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 10% 0%, #dfe6ff 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 100%, #e6f0ff 0%, transparent 50%), var(--bg);
    color: var(--text); display: flex; justify-content: center; align-items: center; padding: 18px;
  }
  #app {
    width: 900px; max-width: 100%; height: 100%; max-height: 880px;
    display: flex; flex-direction: column; background: var(--panel);
    border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; box-shadow: 0 6px 16px rgba(79,110,247,.3);
  }
  header .name { font-size: 15.5px; font-weight: 700; }
  header .status { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
                box-shadow: 0 0 0 3px rgba(34,197,94,.18); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  header .right { margin-left: auto; }
  #newchat {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text-2);
    font-size: 13px; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  #newchat:hover { border-color: var(--accent); color: var(--accent); }
  #msgs { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
  #msgs::-webkit-scrollbar { width: 8px; }
  #msgs::-webkit-scrollbar-thumb { background: #cfd6e4; border-radius: 8px; }
  .row { display: flex; gap: 11px; align-items: flex-start; animation: rise .26s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .row.user { flex-direction: row-reverse; }
  .avatar-sm {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .row.ai .avatar-sm { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .row.user .avatar-sm { background: linear-gradient(135deg, #34d399, #10b981); color: #fff; }
  .msgwrap { min-width: 80px; max-width: 78%; display: flex; flex-direction: column; }
  .bubble {
    padding: 12px 15px; border-radius: 14px; font-size: 14.6px; line-height: 1.72;
    white-space: pre-wrap; word-break: break-word; background: var(--ai-bubble); color: var(--text);
    border: 1px solid var(--line); border-top-left-radius: 4px; box-shadow: 0 2px 10px rgba(31,45,84,.05);
  }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    border: none; border-top-left-radius: 14px; border-top-right-radius: 4px;
    box-shadow: 0 6px 18px rgba(79,110,247,.28);
  }
  .bubble pre.code {
    background: var(--code-bg); color: var(--code-text); padding: 12px 14px; border-radius: 10px;
    margin: 8px 0; overflow-x: auto; font-size: 13px; line-height: 1.6;
    font-family: Consolas, monospace; white-space: pre;
  }
  .bubble code.ic { background: var(--accent-soft); color: var(--accent); padding: 1px 5px;
                    border-radius: 5px; font-size: 13px; font-family: Consolas, monospace; }
  .meta { font-size: 11px; color: var(--text-3); margin-top: 5px; display: flex; gap: 8px; font-family: Consolas, monospace; }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-end; }
  #inp {
    flex: 1; border: 1.5px solid var(--line); border-radius: 14px; background: var(--panel-2);
    color: var(--text); outline: none; font-size: 14.6px; padding: 12px 14px; height: 48px;
    max-height: 150px; resize: none; font-family: inherit; line-height: 1.5;
  }
  #inp:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #send {
    border: none; cursor: pointer; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 15px; font-weight: 600; height: 48px; padding: 0 26px; border-radius: 14px;
    box-shadow: 0 6px 16px rgba(79,110,247,.28); font-family: inherit;
  }
  #send:disabled { background: #c8d0e6; box-shadow: none; cursor: default; }
  #typing { display: none; gap: 5px; align-items: center; padding: 0 24px 8px; color: var(--text-3); font-size: 12.5px; }
  #typing .d { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .35; animation: bounce 1.2s infinite; }
  #typing .d:nth-child(2) { animation-delay: .15s } #typing .d:nth-child(3) { animation-delay: .3s }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .35 } 30% { transform: translateY(-4px); opacity: 1 } }
  @media (max-width: 700px) { body { padding: 0 } #app { border-radius: 0; max-height: none } .msgwrap { max-width: 86% } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">AI</div>
    <div>
      <div class="name">AI 助手</div>
      <div class="status"><span class="dot"></span>在线 · 由本机电脑算力驱动</div>
    </div>
    <div class="right"><button id="newchat">＋ 新会话</button></div>
  </header>
  <div id="msgs"></div>
  <div id="typing"><span class="d"></span><span class="d"></span><span class="d"></span></div>
  <footer>
    <textarea id="inp" placeholder="发消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
    <button id="send">发送</button>
  </footer>
</div>
<script>
const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const typing = document.getElementById('typing');

function renderMD(text) {
  let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/```[a-zA-Z0-9]*\n([\s\S]*?)```/g, (m, c) => '<pre class="code">' + c.replace(/\n$/, '') + '</pre>');
  s = s.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
function nowTime() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function addBubble(text, who, usage) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const av = document.createElement('div');
  av.className = 'avatar-sm';
  av.textContent = who === 'user' ? '我' : 'AI';
  const wrap = document.createElement('div');
  wrap.className = 'msgwrap';
  const b = document.createElement('div');
  b.className = 'bubble';
  if (who === 'ai') b.innerHTML = renderMD(text); else b.textContent = text;
  wrap.appendChild(b);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = nowTime();
  if (usage) {
    const u = document.createElement('span');
    u.textContent = ' ↑' + usage.in + ' ↓' + usage.out + ' · 模型 ' + usage.model + ' token';
    meta.appendChild(u);
  }
  wrap.appendChild(meta);
  row.appendChild(av); row.appendChild(wrap);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return b;
}
async function ask() {
  const text = inp.value.trim();
  if (!text) return;
  addBubble(text, 'user');
  inp.value = ''; inp.style.height = '48px';
  send.disabled = true; typing.style.display = 'flex';
  msgs.scrollTop = msgs.scrollHeight;
  let acc = '', usage = null;
  const bubble = addBubble('', 'ai');
  try {
    const resp = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const p = line.slice(5).trim();
        if (p === '[DONE]') continue;
        let obj; try { obj = JSON.parse(p); } catch (e) { continue; }
        if (obj.delta) { typing.style.display = 'none'; acc += obj.delta; bubble.textContent = acc; msgs.scrollTop = msgs.scrollHeight; }
        if (obj.usage) usage = obj.usage;
      }
    }
  } catch (e) {
    if (!acc) bubble.textContent = '连不上服务器，请稍后再试。';
  }
  typing.style.display = 'none';
  if (!acc) bubble.textContent = '（没有收到回复）';
  else bubble.innerHTML = renderMD(acc);
  if (usage) {
    const span = document.createElement('span');
    span.textContent = ' ↑' + usage.in + ' ↓' + usage.out + ' · 模型 ' + usage.model + ' token';
    bubble.parentNode.querySelector('.meta').appendChild(span);
  }
  send.disabled = false; inp.focus();
}
document.getElementById('newchat').onclick = () => { msgs.innerHTML = ''; addBubble('新会话。有什么想问的？', 'ai'); };
send.onclick = ask;
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
inp.addEventListener('input', () => { inp.style.height = '48px'; inp.style.height = Math.min(inp.scrollHeight, 150) + 'px'; });
addBubble('你好！我是 AI 助手。回答由本机电脑上的模型生成。', 'ai');
inp.focus();
</script>
</body>
</html>
